<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>親戚稱謂配對練習（可拖拉＋朗讀）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drop-ok { border-color: #10b981; background: #ecfdf3; }
    .drop-bad { border-color: #ef4444; background: #fef2f2; }
    .tile-dragging { opacity: 0.7; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-5xl mx-auto px-4 py-6 space-y-6">
    <header class="space-y-2">
      <h1 class="text-2xl font-bold">父系／母系親戚稱謂配對練習</h1>
      <p class="text-sm text-slate-600">拖拉或點選配對；每個稱謂可朗讀。若未出聲，請先點擊頁面以啟用語音。</p>
    </header>

    <div id="sections" class="space-y-6"></div>
  </div>

  <script>
    // 資料：以圖片中的表格為準（包含地方用法，可能與標準稱謂略有差異）
    const sectionData = [
      {
        id: "maternal",
        title: "母系親戚的稱謂是怎樣的？",
        columns: [
          { key: "cantonese", label: "廣州話口語" },
          { key: "mandarin",  label: "普通話口語" },
          { key: "written",   label: "書面語" }
        ],
        rows: [
          { person: "媽媽的爸爸", answers: { cantonese: "公公", mandarin: "姥爺", written: "外祖父" } },
          { person: "媽媽的媽媽", answers: { cantonese: "婆婆", mandarin: "姥姥", written: "外祖母" } },
          { person: "媽媽的兄弟", answers: { cantonese: "舅父", mandarin: "舅舅", written: "舅父" } },
          { person: "媽媽的姐姐", answers: { cantonese: "嫂媽", mandarin: "嬸媽", written: "嬸母" } },
          { person: "媽媽的妹妹", answers: { cantonese: "阿姨", mandarin: "嬸媽", written: "嬸母" } },
          { person: "舅父的妻子", answers: { cantonese: "舅母", mandarin: "舅媽", written: "舅母" } },
          { person: "姨母的丈夫", answers: { cantonese: "姨丈", mandarin: "姨爸", written: "姨丈" } },
        ],
      },
      {
        id: "paternal",
        title: "父系親戚的稱謂是怎樣的？",
        columns: [
          { key: "cantonese", label: "廣州話口語" },
          { key: "mandarin",  label: "普通話口語" },
          { key: "written",   label: "書面語" }
        ],
        rows: [
          { person: "爸爸的爸爸", answers: { cantonese: "爺爺", mandarin: "爺爺", written: "祖父" } },
          { person: "爸爸的媽媽", answers: { cantonese: "嫲嫲", mandarin: "奶奶", written: "祖母" } },
          { person: "爸爸的哥哥", answers: { cantonese: "伯父", mandarin: "伯伯", written: "伯父" } },
          { person: "爸爸的弟弟", answers: { cantonese: "阿叔", mandarin: "叔叔", written: "叔父" } },
          { person: "爸爸的姐姐", answers: { cantonese: "姑媽", mandarin: "姑媽", written: "姑母" } },
          { person: "爸爸的妹妹", answers: { cantonese: "姑姐", mandarin: "姑姑", written: "姑母" } },
          { person: "伯父的妻子", answers: { cantonese: "伯娘", mandarin: "伯母", written: "伯母" } },
          { person: "姑母的丈夫", answers: { cantonese: "姑丈", mandarin: "姑爸", written: "姑丈" } },
        ],
      }
    ];

    // 語音朗讀
    const preferredVoices = ["yue-HK", "yue-Hant-HK", "zh-HK", "zh-TW", "zh-CN"];
    function pickVoice() {
      const vs = speechSynthesis.getVoices();
      return vs.find(v => preferredVoices.includes(v.lang))
          || vs.find(v => v.lang && v.lang.startsWith("yue"))
          || vs.find(v => v.lang && v.lang.startsWith("zh"))
          || null;
    }
    function speak(text) {
      if (!("speechSynthesis" in window) || !text) return;
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.lang = v ? v.lang : "zh-HK";
      u.rate = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
    // 預載語音
    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      if (typeof speechSynthesis.onvoiceschanged !== "undefined") {
        speechSynthesis.onvoiceschanged = () => {};
      }
    }

    // 狀態管理
    const sectionStates = {};

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildTiles(section) {
      const tiles = [];
      section.rows.forEach((row, ri) => {
        section.columns.forEach(col => {
          tiles.push({
            id: `${section.id}-r${ri}-${col.key}`,
            text: row.answers[col.key],
            target: `${section.id}-r${ri}-${col.key}`,
          });
        });
      });
      return tiles;
    }

    function renderSection(section) {
      const root = document.createElement("section");
      root.className = "bg-white rounded-lg shadow border border-slate-200 p-4 space-y-4";
      root.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-lg font-semibold">${section.title}</h2>
            <p class="text-xs text-slate-600">拖拉或點選配對；點 🔊 可朗讀。</p>
          </div>
          <div class="flex flex-wrap gap-2 text-sm">
            <button data-act="shuffle" data-section="${section.id}" class="px-3 py-1.5 rounded bg-emerald-600 text-white hover:bg-emerald-700">🔀 重排</button>
            <button data-act="check" data-section="${section.id}" class="px-3 py-1.5 rounded bg-indigo-600 text-white hover:bg-indigo-700">✅ 批改</button>
            <button data-act="show" data-section="${section.id}" class="px-3 py-1.5 rounded bg-amber-500 text-white hover:bg-amber-600">👀 顯示答案</button>
            <button data-act="reset" data-section="${section.id}" class="px-3 py-1.5 rounded bg-slate-200 text-slate-800 hover:bg-slate-300">♻️ 重設</button>
          </div>
        </div>
        <p id="${section.id}-status" class="text-sm text-slate-600">尚未作答。</p>

        <div class="space-y-3">
          <div class="overflow-x-auto">
            <div class="min-w-full">
              <div class="grid grid-cols-4 text-sm font-semibold bg-slate-100 border border-slate-200">
                <div class="p-2 border-r border-slate-200">人物</div>
                ${section.columns.map(c => `<div class="p-2 border-r last:border-r-0 border-slate-200">${c.label}</div>`).join("")}
              </div>
              <div id="${section.id}-table" class="divide-y divide-slate-200 border border-slate-200 border-t-0">
              </div>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-1">待配對的稱謂（拖到上表空格或點選後再點空格）：</h3>
            <div id="${section.id}-bank" class="min-h-14 flex flex-wrap gap-2 bg-slate-100 border border-slate-200 rounded p-2"></div>
          </div>
        </div>
      `;
      document.getElementById("sections").appendChild(root);

      // 狀態
      sectionStates[section.id] = {
        tiles: shuffle(buildTiles(section)),
        selectedTileId: null,
      };

      renderTable(section);
      renderBank(section);
    }

    function createTileEl(tile, sectionId) {
      const el = document.createElement("div");
      el.className = "tile cursor-move select-none px-3 py-1.5 rounded border border-slate-300 bg-white shadow-sm flex items-center gap-2 text-sm";
      el.draggable = true;
      el.dataset.tileId = tile.id;
      el.dataset.target = tile.target;
      el.innerHTML = `<span class="flex-1">${tile.text}</span>
                      <button type="button" class="text-emerald-700 hover:text-emerald-900" data-say="${tile.text}">🔊</button>`;
      return el;
    }

    function renderBank(section) {
      const bank = document.getElementById(`${section.id}-bank`);
      bank.innerHTML = "";
      sectionStates[section.id].tiles.forEach(t => {
        // Only those not already in table
        if (!document.querySelector(`[data-zone="${t.target}"] .tile`)) {
          bank.appendChild(createTileEl(t, section.id));
        }
      });
    }

    function renderTable(section) {
      const tbody = document.getElementById(`${section.id}-table`);
      tbody.innerHTML = "";
      section.rows.forEach((row, ri) => {
        const rowEl = document.createElement("div");
        rowEl.className = "grid grid-cols-4 text-sm";
        // 人物欄
        const personCell = document.createElement("div");
        personCell.className = "p-2 border-r border-slate-200 flex items-center gap-2 bg-white";
        personCell.innerHTML = `<span>${row.person}</span>
                                <button class="text-emerald-700 hover:text-emerald-900" data-say="${row.person}">🔊</button>`;
        rowEl.appendChild(personCell);

        // 其他欄位 drop zone
        section.columns.forEach(col => {
          const dz = document.createElement("div");
          dz.className = "p-2 border-r last:border-r-0 border-slate-200 bg-white";
          dz.innerHTML = `<div class="drop-zone h-16 rounded border border-dashed border-slate-300 flex items-center justify-center text-xs text-slate-500"
                               data-zone="${section.id}-r${ri}-${col.key}">
                               拖拉或點此放置
                          </div>`;
          rowEl.appendChild(dz);
        });
        tbody.appendChild(rowEl);
      });
    }

    function getTileById(sectionId, tileId) {
      return sectionStates[sectionId].tiles.find(t => t.id === tileId);
    }

    function clearMarks(sectionId) {
      document.querySelectorAll(`#${sectionId}-table .drop-zone`).forEach(z => {
        z.classList.remove("drop-ok","drop-bad");
      });
    }

    // 放置邏輯
    function placeTile(tileEl, targetZone) {
      if (!tileEl || !targetZone) return;
      // 若區內已有磚，移回對應 bank
      const existing = targetZone.querySelector(".tile");
      if (existing) {
        const bank = document.getElementById(targetZone.dataset.zone.split("-")[0] + "-bank");
        bank.appendChild(existing);
      }
      targetZone.innerHTML = "";
      targetZone.appendChild(tileEl);
    }

    // 事件委派
    document.addEventListener("click", (e) => {
      const sayBtn = e.target.closest("[data-say]");
      if (sayBtn) {
        speak(sayBtn.dataset.say);
        return;
      }

      const tile = e.target.closest(".tile");
      if (tile) {
        const sectionId = tile.dataset.target.split("-")[0];
        const state = sectionStates[sectionId];
        // 切換選取
        if (state.selectedTileId === tile.dataset.tileId) {
          state.selectedTileId = null;
          tile.classList.remove("ring-2","ring-amber-400");
        } else {
          // 取消其他高亮
          document.querySelectorAll(".tile").forEach(t => t.classList.remove("ring-2","ring-amber-400"));
          state.selectedTileId = tile.dataset.tileId;
          tile.classList.add("ring-2","ring-amber-400");
        }
        return;
      }

      const zone = e.target.closest(".drop-zone");
      if (zone) {
        const sectionId = zone.dataset.zone.split("-")[0];
        const state = sectionStates[sectionId];
        if (state.selectedTileId) {
          const tileEl = document.querySelector(`.tile[data-tile-id="${state.selectedTileId}"]`);
          placeTile(tileEl, zone);
          state.selectedTileId = null;
          document.querySelectorAll(".tile").forEach(t => t.classList.remove("ring-2","ring-amber-400"));
          clearMarks(sectionId);
        }
        return;
      }

      const actBtn = e.target.closest("[data-act]");
      if (actBtn) {
        const sectionId = actBtn.dataset.section;
        const act = actBtn.dataset.act;
        if (act === "shuffle") {
          sectionStates[sectionId].tiles = shuffle(sectionStates[sectionId].tiles);
          // 移回所有到 bank
          const bank = document.getElementById(`${sectionId}-bank`);
          const allTiles = document.querySelectorAll(`.tile[data-tile-id^="${sectionId}-"]`);
          allTiles.forEach(t => bank.appendChild(t));
          renderBank(sectionData.find(s => s.id === sectionId));
          clearMarks(sectionId);
          document.getElementById(`${sectionId}-status`).textContent = "已重排，尚未作答。";
        } else if (act === "reset") {
          sectionStates[sectionId].tiles = shuffle(sectionStates[sectionId].tiles);
          const bank = document.getElementById(`${sectionId}-bank`);
          const allTiles = document.querySelectorAll(`.tile[data-tile-id^="${sectionId}-"]`);
          allTiles.forEach(t => bank.appendChild(t));
          renderBank(sectionData.find(s => s.id === sectionId));
          document.querySelectorAll(`#${sectionId}-table .drop-zone`).forEach(z => {
            z.innerHTML = "拖拉或點此放置";
          });
          clearMarks(sectionId);
          document.getElementById(`${sectionId}-status`).textContent = "已重設，尚未作答。";
        } else if (act === "show") {
          const section = sectionData.find(s => s.id === sectionId);
          const bank = document.getElementById(`${sectionId}-bank`);
          section.rows.forEach((row, ri) => {
            section.columns.forEach(col => {
              const zone = document.querySelector(`[data-zone="${sectionId}-r${ri}-${col.key}"]`);
              // 找到正確磚
              const tileEl = document.querySelector(`.tile[data-tile-id="${sectionId}-r${ri}-${col.key}"]`);
              if (tileEl) {
                placeTile(tileEl, zone);
              }
            });
          });
          clearMarks(sectionId);
          document.getElementById(`${sectionId}-status`).textContent = "已顯示答案。";
        } else if (act === "check") {
          const section = sectionData.find(s => s.id === sectionId);
          let total = 0, correct = 0;
          document.querySelectorAll(`#${sectionId}-table .drop-zone`).forEach(z => {
            total++;
            const tile = z.querySelector(".tile");
            if (tile && tile.dataset.target === z.dataset.zone) {
              correct++; z.classList.add("drop-ok"); z.classList.remove("drop-bad");
            } else {
              z.classList.add("drop-bad"); z.classList.remove("drop-ok");
            }
          });
          document.getElementById(`${sectionId}-status`).textContent = `已批改：${correct} / ${total}。`;
        }
        return;
      }
    });

    // 拖放事件
    document.addEventListener("dragstart", (e) => {
      const tile = e.target.closest(".tile");
      if (!tile) return;
      tile.classList.add("tile-dragging");
      e.dataTransfer.setData("text/plain", tile.dataset.tileId);
      e.dataTransfer.effectAllowed = "move";
    });
    document.addEventListener("dragend", (e) => {
      const tile = e.target.closest(".tile");
      if (tile) tile.classList.remove("tile-dragging");
    });
    document.addEventListener("dragover", (e) => {
      if (e.target.closest(".drop-zone") || e.target.closest("[id$='-bank']")) {
        e.preventDefault();
      }
    });
    document.addEventListener("drop", (e) => {
      const zone = e.target.closest(".drop-zone");
      const bank = e.target.closest("[id$='-bank']");
      const tileId = e.dataTransfer.getData("text/plain");
      if (!tileId) return;
      const tileEl = document.querySelector(`.tile[data-tile-id="${tileId}"]`);
      if (!tileEl) return;

      if (zone) {
        e.preventDefault();
        const sectionId = zone.dataset.zone.split("-")[0];
        placeTile(tileEl, zone);
        clearMarks(sectionId);
      } else if (bank) {
        e.preventDefault();
        bank.appendChild(tileEl);
        const sectionId = bank.id.replace("-bank","");
        clearMarks(sectionId);
      }
    });

    // 初始化
    sectionData.forEach(renderSection);
  </script>
</body>
</html>
